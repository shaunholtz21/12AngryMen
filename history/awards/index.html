<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Award History</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../css/style.css">
</head>

<body>

  <!-- BACK LINK -->
  <div class="back-link-wrap">
    <a href="../index.html" class="back-link">← Back to League History</a>
  </div>

  <div class="shell shell-tight">

    <!-- ================================
         HEADER
         ================================ -->
    <section class="card card-soft mb-lg">
      <div class="card-header">
        <h1 class="card-title">🏆 Award History</h1>
        <div class="card-meta">All-time winners for every league award</div>
      </div>

      <div class="card-body">
        <p class="hero-sub mb-1">
          Explore the full history of every award in the league — from season-long dominance to draft‑day chaos.
        </p>

        <div id="season-awards" class="mt-lg"></div>
      </div>
    </section>

    <!-- ================================
         AWARD LIST
         ================================ -->
    <section class="section-block">
      <h2 class="section-title">Awards</h2>

      <div class="panel mt-sm">
        <div id="awards-container" class="card-grid"></div>
      </div>
    </section>
  </div>
<script>
async function loadAwards() {
  const container = document.getElementById("awards-container");
  if (!container) return;

  try {
    const indexRes = await fetch("index.json");
    const indexData = await indexRes.json();

    for (const award of indexData.awards) {
      const url = `${award.folder}/index.html`;
      const title = award.title || award.folder;

      const card = document.createElement("article");
      card.className = "card card-soft card-accent-left";

      card.innerHTML = `
        <div class="card-header">
          <h3 class="card-title">${title}</h3>
          <div class="card-meta">Award</div>
        </div>
        <div class="card-body">
          <p>Explore the history of the ${title}.</p>
          <a href="${url}" class="card-link">View Award →</a>
        </div>
      `;

      container.appendChild(card);
    }

  } catch (err) {
    console.error("Error loading awards:", err);
  }
}

async function getLatestCompletedYear() {
  // Use Iron Bank as the reference award (populated every year by the
  // spreadsheet sync) to find the newest year that actually has a winner.
  const seasons = await fetch("seasons.json").then((r) => r.json());
  const sorted = [...seasons].sort((a, b) => b - a);

  for (const year of sorted) {
    try {
      const res = await fetch(`iron-bank/${year}.json`);
      if (!res.ok) continue;
      const data = await res.json();
      if (data && data.Team) return year;
    } catch (err) {
      continue;
    }
  }

  return sorted[0]; // fallback: newest listed season, even if unfinished
}

async function loadSeasonAwards() {
  const container = document.getElementById("season-awards");
  if (!container) return;

  try {
    const year = await getLatestCompletedYear();

    const indexRes = await fetch("index.json");
    const indexData = await indexRes.json();

    const results = [];

    for (const award of indexData.awards) {
      const folder = award.folder;
      const jsonPath = `${folder}/${year}.json`;

      try {
        const res = await fetch(jsonPath);
        if (!res.ok) continue;

        const data = await res.json();
        let winnerText = "";

        // Fantasy Fiver = array of weekly winners
        if (Array.isArray(data)) {
          // first 4 rows are header/meta in your sample
          const weeks = Math.max(0, data.length - 4);
          winnerText = `${weeks} weekly winners — view award for full breakdown`;
        }
        // Normal awards with "Team"
        else if (data.Team) {
          winnerText = `Winner: ${data.Team}`;
        }
        // Fallback
        else {
          winnerText = `Winner data available — view award`;
        }

        results.push(`
          <div class="card card-soft mb-md">
            <div class="card-header">
              <h3 class="card-title">${award.title}</h3>
            </div>
            <div class="card-body">
              <p>${winnerText}</p>
            </div>
          </div>
        `);
      } catch (err) {
        console.error("Error loading award year JSON:", folder, err);
      }
    }

    container.innerHTML = `
      <h2 class="section-title">${year} Completed Season Awards</h2>
      ${results.join("")}
    `;
  } catch (err) {
    console.error("Error loading season awards index:", err);
  }
}

loadAwards();
loadSeasonAwards();
</script>

</body>
</html>
