<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Notes</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/loader.js" defer></script>
</head>

<body>
  <div class="page">

    <!-- HEADER -->
    <header>
      <nav class="nav">
        <a href="../index.html" class="nav-title-main">Home</a>

        <div class="nav-links">
          <a href="../weekly-notes/index.html">Weekly Notes</a>
          <a href="../history/index.html">League History</a>
        </div>
      </nav>
    </header>

    <!-- MAIN -->
    <main>
      <div class="shell">

        <!-- LEFT COLUMN -->
        <div>
          <!-- HERO -->
          <div class="hero">
            <h1 class="hero-title">Weekly Notes Archive</h1>
            <p class="hero-sub">
              Choose a season and week to view any weekly recap from league history.
            </p>
          </div>

          <!-- SELECT RECAP CARD -->
          <section class="card card-soft mt-lg p-lg">
            <div class="card-header">
              <h3 class="card-title">Select Recap</h3>
            </div>

            <div class="card-body form-stack">
              <label>
                <span class="form-label">Season</span>
                <select id="wn-seasonSelect" class="form-select"></select>
              </label>

              <label>
                <span class="form-label">Week</span>
                <select id="wn-weekSelect" class="form-select"></select>
              </label>

              <button id="wn-loadRecapBtn" class="btn-primary">
                Load Recap
              </button>
            </div>
          </section>

          <!-- LOADED RECAP CARD -->
          <section class="card card-soft mt-xl">
            <div class="card-header">
              <h3 class="card-title" id="weeklyRecapTitle">Weekly Recap</h3>
            </div>
            <div class="card-body">
              <div id="wn-content">
                <p class="text-muted">
                  Select a season and week above, then click “Load Recap” to view the weekly note.
                </p>
              </div>
            </div>
          </section>
        </div>

        <!-- RIGHT SIDEBAR (kept for symmetry / future use) -->
        <aside class="sidebar"></aside>

      </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <p>© 12 Angry Men League</p>
    </footer>

  </div>
</body>
</html>
