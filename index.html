<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>12 Angry Men League</title>

  <link rel="stylesheet" href="css/style.css" />
  <script src="js/loader.js" defer></script>
</head>

<body>
  <div class="page">

    <!-- HEADER -->
    <header>
      <nav class="nav">
        <a href="index.html" class="nav-title-main">Home</a>

        <div class="nav-links">
          <a href="weekly-notes/index.html">Weekly Notes</a>
          <a href="history/index.html">League History</a>
        </div>
      </nav>
    </header>

    <!-- MAIN -->
    <main>

      <div class="shell home-grid">

        <!-- HERO -->
        <div class="hero">
          <h1 class="hero-title">12 Angry Men</h1>
          <p class="hero-sub">
            Your home for league history, weekly notes, and championship glory.
          </p>
        </div>

        <!-- LEFT COLUMN: LAST MAN STANDING -->
        <div>
          <section class="card card-soft">
            <div class="card-header">
              <h3 class="card-title">🏆 Last Man Standing</h3>
              <div class="card-meta" id="lmsHomeMeta"></div>
            </div>
            <div class="card-body" id="lmsHomeContainer">
              <p class="text-muted">Loading Last Man Standing…</p>
            </div>
          </section>
        </div>

        <!-- MIDDLE COLUMN: FEATURED RECAP (full length) -->
        <div id="draftRecapContainer">
          <p class="text-muted">Loading recap…</p>
        </div>

        <!-- RIGHT SIDEBAR: FANTASY FIVER / RING SEEKER -->
        <aside class="sidebar">

          <section class="card card-soft">
            <div class="card-header">
              <h3 class="card-title" id="fantasyFiverHomeTitle">🗓 Fantasy Fiver</h3>
            </div>
            <div class="card-body" id="fantasyFiverHomeContainer">
              <p class="text-muted">Loading…</p>
            </div>
          </section>

          <section class="card card-soft">
            <div class="card-header">
              <h3 class="card-title" id="ringSeekerHomeTitle">💍 Ring Seeker Picks</h3>
            </div>
            <div class="card-body" id="ringSeekerHomeContainer">
              <p class="text-muted">Loading…</p>
            </div>
          </section>

        </aside>

      </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <p>© 12 Angry Men League</p>
    </footer>

  </div>

  <script>
    // ------------------------------
    // Shared: current (newest) season
    // ------------------------------
    async function getCurrentSeason() {
      const seasons = await fetch("history/awards/seasons.json").then((r) => r.json());
      return [...seasons].sort((a, b) => b - a)[0];
    }

    // ------------------------------
    // Middle: featured recap (full length)
    // Shows the latest weekly recap for the current season once one
    // exists; falls back to the latest draft recap before the season
    // has any weeks posted.
    // ------------------------------
    async function loadLatestWeekRecap(container) {
      const year = await getCurrentSeason();
      const weeksData = await fetch(`recaps/${year}/weeks.json`).then((r) => r.json());

      if (!weeksData.weeks || weeksData.weeks.length === 0) return false;

      const latestWeek = [...weeksData.weeks].sort(
        (a, b) => parseInt(b.match(/\d+/)) - parseInt(a.match(/\d+/))
      )[0];

      const html = await fetch(`recaps/${year}/${latestWeek}.html`).then((r) => r.text());

      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");
      const card = doc.querySelector(".card");

      if (!card) return false;

      container.innerHTML = card.outerHTML;
      return true;
    }

    async function loadLatestDraftRecap(container) {
      const indexData = await fetch("history/drafts/index.json").then((r) => r.json());

      const drafts = indexData.drafts.sort((a, b) => {
        const yearA = parseInt(a.match(/\d+/));
        const yearB = parseInt(b.match(/\d+/));
        return yearB - yearA;
      });

      const latest = drafts[0];
      const html = await fetch(`history/drafts/${latest}`).then((r) => r.text());

      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");
      const card = doc.querySelector(".card");

      container.innerHTML = card
        ? card.outerHTML
        : `<p class="text-muted">Unable to load the latest draft recap.</p>`;
    }

    async function loadFeaturedRecap() {
      const container = document.getElementById("draftRecapContainer");

      try {
        const loadedWeekRecap = await loadLatestWeekRecap(container);
        if (!loadedWeekRecap) await loadLatestDraftRecap(container);
      } catch (err) {
        try {
          await loadLatestDraftRecap(container);
        } catch (err2) {
          container.innerHTML = `<p class="text-muted">Unable to load a recap.</p>`;
        }
      }
    }

    // ------------------------------
    // Left: current Last Man Standing status
    // ------------------------------
    async function loadLmsHome() {
      const container = document.getElementById("lmsHomeContainer");
      const metaEl = document.getElementById("lmsHomeMeta");

      try {
        const year = await getCurrentSeason();
        metaEl.textContent = `${year} Season`;

        const elimData = await fetch(`history/awards/last-man-standing/${year}.json`).then((r) => r.json());
        const teamData = await fetch(`history/awards/last-man-standing/${year}-teams.json`).then((r) => r.json());

        const elimMap = new Map(elimData.map((e) => [e.Team, e.Week]));
        const remaining = teamData.filter((t) => !elimMap.has(t));
        const eliminated = teamData
          .filter((t) => elimMap.has(t))
          .sort((a, b) => elimMap.get(a) - elimMap.get(b));

        let statusHtml;
        if (elimData.length === 0) {
          statusHtml = `<p>Season just underway — all <strong>${teamData.length}</strong> teams still alive.</p>`;
        } else if (remaining.length === 1) {
          statusHtml = `
            <div class="award-winner">🏆 ${remaining[0]}</div>
            <p class="text-muted mt-sm">Winner — last team standing after ${elimData.length} eliminations.</p>
          `;
        } else {
          statusHtml = `<p><strong>${remaining.length}</strong> of ${teamData.length} teams still alive.</p>`;
        }

        const aliveHtml = remaining.length
          ? remaining.map((t) => `
              <div class="recap-bullet">
                <div class="recap-bullet-dot"></div>
                <div>${t}</div>
              </div>
            `).join("")
          : `<p class="text-muted">No teams remaining.</p>`;

        const eliminatedHtml = eliminated.length
          ? eliminated.map((t) => `
              <div class="recap-bullet">
                <div class="recap-bullet-dot"></div>
                <div>${t} <span class="text-muted">— Week ${elimMap.get(t)}</span></div>
              </div>
            `).join("")
          : `<p class="text-muted">No eliminations yet.</p>`;

        container.innerHTML = `
          ${statusHtml}
          <section class="lms-table-section mt-sm">
            <h5>Still Alive</h5>
            ${aliveHtml}
          </section>
          <section class="lms-table-section mt-sm">
            <h5>Eliminated</h5>
            ${eliminatedHtml}
          </section>
          <p class="mt-sm"><a href="history/awards/last-man-standing/index.html" class="card-link">View Full History →</a></p>
        `;

      } catch (err) {
        console.error("Error loading LMS home tile:", err);
        container.innerHTML = `<p class="text-muted">Unable to load Last Man Standing data.</p>`;
      }
    }

    // ------------------------------
    // Right: current Fantasy Fiver weekly winners
    // ------------------------------
    async function loadFantasyFiverHome() {
      const container = document.getElementById("fantasyFiverHomeContainer");
      const titleEl = document.getElementById("fantasyFiverHomeTitle");

      try {
        const year = await getCurrentSeason();
        titleEl.textContent = `🗓 Fantasy Fiver — ${year}`;

        const data = await fetch(`history/awards/fantasy-fiver/${year}.json`).then((r) => r.json());

        const weeks = data.filter((r) =>
          r["Fantasy Fiver Award"] &&
          /^Week \d+/.test(r["Fantasy Fiver Award"]) &&
          r["Unnamed: 1"]
        );

        container.innerHTML = weeks.length
          ? weeks.map((w) => `
              <div class="recap-bullet">
                <div class="recap-bullet-dot"></div>
                <div>${w["Fantasy Fiver Award"]}: ${w["Unnamed: 1"]} (${w["Unnamed: 2"]})</div>
              </div>
            `).join("")
          : `<p class="text-muted">No weekly winners recorded yet.</p>`;

      } catch (err) {
        console.error("Error loading Fantasy Fiver home tile:", err);
        container.innerHTML = `<p class="text-muted">Unable to load Fantasy Fiver data.</p>`;
      }
    }

    // ------------------------------
    // Right: current Ring Seeker Super Bowl picks
    // ------------------------------
    async function loadRingSeekerHome() {
      const container = document.getElementById("ringSeekerHomeContainer");
      const titleEl = document.getElementById("ringSeekerHomeTitle");

      try {
        const year = await getCurrentSeason();
        titleEl.textContent = `💍 Ring Seeker Picks — ${year}`;

        const res = await fetch(`history/awards/ring-seeker/${year}-picks.json`);
        if (!res.ok) throw new Error("No picks file for this season yet");
        const picks = await res.json();

        container.innerHTML = picks.length
          ? picks.map((p) => `
              <div class="recap-bullet">
                <div class="recap-bullet-dot"></div>
                <div><strong>${p.Team}</strong> → ${p.Prediction}</div>
              </div>
            `).join("")
          : `<p class="text-muted">No Ring Seeker picks recorded yet.</p>`;

      } catch (err) {
        container.innerHTML = `<p class="text-muted">Ring Seeker picks aren't available yet.</p>`;
      }
    }

    loadFeaturedRecap();
    loadLmsHome();
    loadFantasyFiverHome();
    loadRingSeekerHome();
  </script>
</body>
</html>
